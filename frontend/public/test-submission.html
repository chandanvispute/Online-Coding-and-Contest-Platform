<!DOCTYPE html>
<html>
<head>
    <title>Test Submission API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #0d1117; color: #c9d1d9; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #333; border-radius: 8px; }
        button { padding: 10px 20px; margin: 5px; background: #1f6feb; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #388bfd; }
        pre { background: #1a1a1a; padding: 10px; border-radius: 5px; overflow-x: auto; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>🧪 Test Submission API</h1>
    
    <div class="test-section">
        <h2>Test Submission</h2>
        <button onclick="testSubmission()">Submit Test Code</button>
        <div id="submissionResult"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080';
        
        async function testSubmission() {
            const resultDiv = document.getElementById('submissionResult');
            resultDiv.innerHTML = 'Testing submission...';
            
            const submissionData = {
                problemId: 1,
                languageId: 1,
                code: `public class Solution {
    public static void main(String[] args) {
        System.out.println("0 1");
    }
}`,
                userId: 1
            };
            
            try {
                console.log('Sending submission:', submissionData);
                
                const response = await fetch(API_BASE + '/api/submissions/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(submissionData)
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                if (response.ok) {
                    const result = await response.json();
                    console.log('Submission result:', result);
                    
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ Submission Successful!</h3>
                            <pre>${JSON.stringify(result, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    const errorText = await response.text();
                    console.error('Submission failed:', response.status, errorText);
                    
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ Submission Failed</h3>
                            <p>Status: ${response.status}</p>
                            <pre>${errorText}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Network error:', error);
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Network Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
