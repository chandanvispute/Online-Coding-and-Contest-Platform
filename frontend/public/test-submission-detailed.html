<!DOCTYPE html>
<html>
<head>
    <title>Test Submission with Detailed Results</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: #0d1117; 
            color: #c9d1d9; 
            line-height: 1.6;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .test-section { 
            margin: 20px 0; 
            padding: 20px; 
            border: 1px solid #30363d; 
            border-radius: 8px; 
            background: #161b22;
        }
        button { 
            padding: 12px 24px; 
            margin: 5px; 
            background: #238636; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 500;
            transition: background-color 0.2s;
        }
        button:hover { background: #2ea043; }
        button:disabled { background: #484f58; cursor: not-allowed; }
        pre { 
            background: #0d1117; 
            padding: 12px; 
            border-radius: 6px; 
            overflow-x: auto; 
            border: 1px solid #30363d;
            margin: 10px 0;
        }
        .success { color: #3fb950; }
        .error { color: #f85149; }
        .warning { color: #d29922; }
        .info { color: #58a6ff; }
        
        /* Test Results Styling */
        .results-container {
            margin-top: 20px;
            border: 1px solid #30363d;
            border-radius: 8px;
            background: #161b22;
        }
        
        .results-header {
            padding: 16px;
            border-bottom: 1px solid #30363d;
            background: #21262d;
            border-radius: 8px 8px 0 0;
        }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }
        
        .status-badge.accepted { background: #1a7f37; color: white; }
        .status-badge.wrong-answer { background: #da3633; color: white; }
        .status-badge.runtime-error { background: #fb8500; color: white; }
        
        .summary-stats {
            display: flex;
            gap: 20px;
            margin-top: 12px;
            font-size: 14px;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .test-case-result {
            border-bottom: 1px solid #30363d;
            padding: 16px;
        }
        
        .test-case-result:last-child {
            border-bottom: none;
        }
        
        .test-case-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .test-case-title {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .test-case-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .test-case-status.passed { background: #1a7f37; color: white; }
        .test-case-status.failed { background: #da3633; color: white; }
        
        .test-case-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 12px;
        }
        
        .io-section {
            background: #0d1117;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
        }
        
        .io-label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #f0f6fc;
        }
        
        .code-block {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 8px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .code-block.expected { border-left: 3px solid #3fb950; }
        .code-block.incorrect { border-left: 3px solid #f85149; }
        .code-block.correct { border-left: 3px solid #3fb950; }
        
        .execution-stats {
            grid-column: 1 / -1;
            display: flex;
            gap: 16px;
            margin-top: 12px;
            font-size: 13px;
            color: #8b949e;
        }
        
        .sample-indicator {
            background: #1f6feb;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .hidden-indicator {
            background: #6e7681;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #58a6ff;
        }
        
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #30363d;
            border-top: 2px solid #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .code-editor {
            width: 100%;
            height: 200px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            color: #c9d1d9;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            resize: vertical;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        select {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px 12px;
            color: #c9d1d9;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 Test Submission with Detailed Results</h1>
            <p>Test code submission and view detailed test case results</p>
        </div>
        
        <div class="test-section">
            <h2>Code Submission Test</h2>
            
            <div class="form-group">
                <label class="form-label">Programming Language:</label>
                <select id="languageSelect">
                    <option value="1">Java</option>
                    <option value="2">Python</option>
                    <option value="3">C++</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">Code:</label>
                <textarea id="codeEditor" class="code-editor" placeholder="Write your code here...">public class Solution {
    public static void main(String[] args) {
        // Two Sum solution
        System.out.println("0 1");
    }
}</textarea>
            </div>
            
            <button onclick="runSampleTests()" id="runBtn">🏃 Run Sample Tests</button>
            <button onclick="submitCode()" id="submitBtn">📤 Submit Code</button>
            
            <div id="submissionResult"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080';
        
        async function runSampleTests() {
            const resultDiv = document.getElementById('submissionResult');
            const runBtn = document.getElementById('runBtn');
            
            runBtn.disabled = true;
            runBtn.innerHTML = '<div class="spinner"></div> Running...';
            
            resultDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    Running sample test cases...
                </div>
            `;
            
            const code = document.getElementById('codeEditor').value;
            const languageId = document.getElementById('languageSelect').value;
            
            try {
                const formData = new URLSearchParams();
                formData.append('problemId', '1');
                formData.append('languageId', languageId);
                formData.append('code', code);
                
                const response = await fetch(`${API_BASE}/api/submissions/run-sample`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData
                });
                
                if (response.ok) {
                    const result = await response.json();
                    console.log('Sample test result:', result);
                    displayDetailedResults(result, 'Sample Test Results');
                } else {
                    const errorText = await response.text();
                    resultDiv.innerHTML = `
                        <div class="results-container">
                            <div class="results-header">
                                <div class="status-badge runtime-error">❌ Error</div>
                            </div>
                            <div style="padding: 16px;">
                                <pre class="error">${errorText}</pre>
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="results-container">
                        <div class="results-header">
                            <div class="status-badge runtime-error">❌ Network Error</div>
                        </div>
                        <div style="padding: 16px;">
                            <p class="error">${error.message}</p>
                        </div>
                    </div>
                `;
            } finally {
                runBtn.disabled = false;
                runBtn.innerHTML = '🏃 Run Sample Tests';
            }
        }
        
        async function submitCode() {
            const resultDiv = document.getElementById('submissionResult');
            const submitBtn = document.getElementById('submitBtn');
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="spinner"></div> Submitting...';
            
            resultDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    Submitting code and running all test cases...
                </div>
            `;
            
            const submissionData = {
                problemId: 1,
                languageId: parseInt(document.getElementById('languageSelect').value),
                code: document.getElementById('codeEditor').value,
                userId: 1
            };
            
            try {
                const response = await fetch(`${API_BASE}/api/submissions/submit`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(submissionData)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    console.log('Submission result:', result);
                    displayDetailedResults(result, 'Submission Results');
                } else {
                    const errorText = await response.text();
                    resultDiv.innerHTML = `
                        <div class="results-container">
                            <div class="results-header">
                                <div class="status-badge runtime-error">❌ Submission Failed</div>
                            </div>
                            <div style="padding: 16px;">
                                <pre class="error">${errorText}</pre>
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="results-container">
                        <div class="results-header">
                            <div class="status-badge runtime-error">❌ Network Error</div>
                        </div>
                        <div style="padding: 16px;">
                            <p class="error">${error.message}</p>
                        </div>
                    </div>
                `;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '📤 Submit Code';
            }
        }
        
        function displayDetailedResults(result, title) {
            const resultDiv = document.getElementById('submissionResult');
            
            const statusClass = result.status === 'Accepted' || result.status === 'Sample Tests Passed' 
                ? 'accepted' 
                : result.status === 'Wrong Answer' || result.status === 'Sample Tests Failed'
                ? 'wrong-answer'
                : 'runtime-error';
            
            const statusIcon = statusClass === 'accepted' ? '✅' : '❌';
            
            let html = `
                <div class="results-container">
                    <div class="results-header">
                        <div class="status-badge ${statusClass}">
                            ${statusIcon} ${result.status}
                        </div>
                        <div class="summary-stats">
                            <div class="stat-item">
                                <span>📊</span>
                                <span>${result.passedTestCases || 0}/${result.totalTestCases || 0} passed</span>
                            </div>
                            <div class="stat-item">
                                <span>⏱️</span>
                                <span>${result.executionTime || 0}ms</span>
                            </div>
                            <div class="stat-item">
                                <span>💾</span>
                                <span>${result.memoryUsed || 0}MB</span>
                            </div>
                            <div class="stat-item">
                                <span>📈</span>
                                <span>${(result.successRate || 0).toFixed(1)}%</span>
                            </div>
                        </div>
                    </div>
            `;
            
            if (result.testCaseResults && result.testCaseResults.length > 0) {
                result.testCaseResults.forEach(testCase => {
                    const passed = testCase.passed;
                    const isSample = testCase.isSample;
                    
                    html += `
                        <div class="test-case-result">
                            <div class="test-case-header">
                                <div class="test-case-title">
                                    <span>${isSample ? '👁️' : '🔒'}</span>
                                    <span>Test Case ${testCase.testCaseNumber}</span>
                                    <span class="${isSample ? 'sample-indicator' : 'hidden-indicator'}">
                                        ${isSample ? 'SAMPLE' : 'HIDDEN'}
                                    </span>
                                </div>
                                <div class="test-case-status ${passed ? 'passed' : 'failed'}">
                                    ${passed ? '✅ PASSED' : '❌ FAILED'}
                                </div>
                            </div>
                            
                            <div class="test-case-details">
                                <div class="io-section">
                                    <div class="io-label">📥 Input:</div>
                                    <div class="code-block">${testCase.input || 'No input'}</div>
                                </div>
                                
                                <div class="io-section">
                                    <div class="io-label">📤 Expected Output:</div>
                                    <div class="code-block expected">${testCase.expectedOutput || 'No expected output'}</div>
                                </div>
                                
                                <div class="io-section">
                                    <div class="io-label">🖥️ Your Output:</div>
                                    <div class="code-block ${passed ? 'correct' : 'incorrect'}">${testCase.actualOutput || 'No output'}</div>
                                </div>
                                
                                <div class="execution-stats">
                                    <span>⏱️ ${testCase.executionTime || 0}ms</span>
                                    <span>💾 ${testCase.memoryUsed || 0}MB</span>
                                    <span>📊 ${testCase.status || 'Unknown'}</span>
                                    ${testCase.error ? `<span class="error">⚠️ ${testCase.error}</span>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                });
            } else {
                html += `
                    <div style="padding: 16px; text-align: center; color: #8b949e;">
                        No test case details available
                    </div>
                `;
            }
            
            html += '</div>';
            resultDiv.innerHTML = html;
        }
    </script>
</body>
</html>
