<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodePlatform - Working Version</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            line-height: 1.6;
        }
        
        .navbar {
            background-color: #161b22;
            padding: 1rem 0;
            border-bottom: 1px solid #30363d;
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }
        
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: #00d8ff;
        }
        
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .page-header {
            margin-bottom: 2rem;
        }
        
        .page-header h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        
        .problems-list {
            display: grid;
            gap: 15px;
        }
        
        .problem-card {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .problem-card:hover {
            border-color: #00d8ff;
            transform: translateY(-2px);
        }
        
        .problem-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .problem-title {
            color: #c9d1d9;
            font-size: 1.1rem;
            margin: 0;
        }
        
        .difficulty-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        
        .difficulty-badge.Easy {
            background-color: rgba(0, 255, 0, 0.2);
            color: #00ff00;
        }
        
        .difficulty-badge.Medium {
            background-color: rgba(255, 165, 0, 0.2);
            color: #ffa500;
        }
        
        .difficulty-badge.Hard {
            background-color: rgba(255, 0, 0, 0.2);
            color: #ff0000;
        }
        
        .problem-stats {
            display: flex;
            gap: 15px;
            color: #8b949e;
            font-size: 0.9rem;
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
            color: #8b949e;
        }
        
        .error {
            text-align: center;
            padding: 2rem;
            color: #ff6b6b;
        }
        
        .no-results {
            text-align: center;
            padding: 2rem;
            color: #8b949e;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <i class="fas fa-code"></i>
                <span>CodePlatform</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="page-header">
            <h1>Problems</h1>
        </div>
        <div class="problems-container">
            <div class="problems-list" id="problemsList">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i> Loading problems...
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = 'http://localhost:8080';
        
        async function loadProblems() {
            const problemsList = document.getElementById('problemsList');
            
            try {
                console.log('Loading problems from API...');
                const response = await fetch(`${API_BASE}/api/problems`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const problems = await response.json();
                console.log('Problems loaded:', problems);
                
                renderProblems(problems);
                
            } catch (error) {
                console.error('Error loading problems:', error);
                problemsList.innerHTML = `
                    <div class="error">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Failed to load problems: ${error.message}</p>
                        <p>Please check if the backend server is running on port 8080.</p>
                    </div>
                `;
            }
        }
        
        function renderProblems(problems) {
            const problemsList = document.getElementById('problemsList');
            
            if (problems.length === 0) {
                problemsList.innerHTML = '<div class="no-results">No problems found</div>';
                return;
            }
            
            let html = '';
            problems.forEach(problem => {
                html += `
                    <div class="problem-card" onclick="alert('Problem ${problem.id}: ${problem.title}')">
                        <div class="problem-card-header">
                            <h3 class="problem-title">${problem.title}</h3>
                            <span class="difficulty-badge ${problem.difficulty}">${problem.difficulty}</span>
                        </div>
                        <div class="problem-stats">
                            <span><i class="fas fa-clock"></i> ${problem.timeLimit}ms</span>
                            <span><i class="fas fa-memory"></i> ${problem.memoryLimit}MB</span>
                        </div>
                    </div>
                `;
            });
            
            problemsList.innerHTML = html;
            console.log('Problems rendered successfully');
        }
        
        // Load problems when page loads
        document.addEventListener('DOMContentLoaded', loadProblems);
    </script>
</body>
</html>
