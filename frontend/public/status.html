<!DOCTYPE html>
<html>
<head>
    <title>CodePlatform Status</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #0d1117; color: #c9d1d9; }
        .status { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: rgba(0, 255, 0, 0.1); border: 1px solid green; }
        .error { background: rgba(255, 0, 0, 0.1); border: 1px solid red; }
        .info { background: rgba(0, 123, 255, 0.1); border: 1px solid #007bff; }
    </style>
</head>
<body>
    <h1>🔍 CodePlatform Status Check</h1>
    <div id="status">Checking...</div>

    <script>
        async function checkStatus() {
            const statusDiv = document.getElementById('status');
            let html = '';

            // Check Backend API
            try {
                const response = await fetch('http://localhost:8080/api/problems');
                if (response.ok) {
                    const problems = await response.json();
                    html += `<div class="status success">✅ Backend API: Working (${problems.length} problems found)</div>`;
                } else {
                    html += `<div class="status error">❌ Backend API: HTTP ${response.status}</div>`;
                }
            } catch (error) {
                html += `<div class="status error">❌ Backend API: ${error.message}</div>`;
            }

            // Check Languages API
            try {
                const response = await fetch('http://localhost:8080/api/languages');
                if (response.ok) {
                    const languages = await response.json();
                    html += `<div class="status success">✅ Languages API: Working (${languages.length} languages found)</div>`;
                } else {
                    html += `<div class="status error">❌ Languages API: HTTP ${response.status}</div>`;
                }
            } catch (error) {
                html += `<div class="status error">❌ Languages API: ${error.message}</div>`;
            }

            // Check Frontend
            html += `<div class="status success">✅ Frontend: Running on port 3000</div>`;

            // Check Docker Services
            html += `<div class="status info">ℹ️ Expected Services:</div>`;
            html += `<div class="status info">• Backend: http://localhost:8080</div>`;
            html += `<div class="status info">• Frontend: http://localhost:3000</div>`;
            html += `<div class="status info">• Database: localhost:5432</div>`;
            html += `<div class="status info">• PgAdmin: http://localhost:5050</div>`;

            statusDiv.innerHTML = html;
        }

        checkStatus();
    </script>
</body>
</html>
