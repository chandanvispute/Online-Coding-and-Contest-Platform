<!DOCTYPE html>
<html>
<head>
    <title>Debug API</title>
</head>
<body>
    <h1>API Debug Test</h1>
    <button onclick="testAPI()">Test API</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Loading...';
            
            try {
                console.log('Making API call to http://localhost:8080/api/problems');
                const response = await fetch('http://localhost:8080/api/problems');
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('Data received:', data);
                
                resultDiv.innerHTML = `
                    <h2>Success!</h2>
                    <p>Found ${data.length} problems:</p>
                    <ul>
                        ${data.map(p => `<li>${p.title} (${p.difficulty})</li>`).join('')}
                    </ul>
                `;
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `<h2>Error:</h2><p>${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
